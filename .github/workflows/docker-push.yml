name: Docker Build & Push

on:
  push:
    branches:
      - main
    
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push action
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/github-actions-app:${{vars.GITHUB_REPO}}:${{github.GITHUB_HEAD_REF}}
            ${{ vars.DOCKERHUB_USERNAME }}/github-actions-app:${{vars.GITHUB_REPO}}:${{github.GITHUB_SHA}}


